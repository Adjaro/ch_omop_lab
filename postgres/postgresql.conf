# PostgreSQL 16 — réglages "lab ETL" pour une machine ~16 Go RAM / 8 vCPU.
# Ajuste shared_buffers (~25 % RAM) et effective_cache_size (~70 % RAM) à ta machine.
# ATTENTION : wal_level=minimal + synchronous_commit=off = vitesse maximale, PAS pour la production.

listen_addresses = '*'
max_connections = 50

# Mémoire
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 128MB
maintenance_work_mem = 1GB
huge_pages = try

# Écriture massive (génération + releases OMOP)
wal_level = minimal                 # COPY dans une table créée dans la même transaction = pas de WAL
max_wal_senders = 0                 # requis par wal_level=minimal (passer à 'logical' pour un CDC PeerDB)
synchronous_commit = off
wal_compression = lz4
wal_buffers = 64MB
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9

# Parallélisme (requêtes analytiques + création d'index)
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Stockage SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Planification
jit = off
default_statistics_target = 200

# Autovacuum (tables bronze en insertion seule)
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_max_workers = 4

# Logs
log_min_duration_statement = 10000
log_checkpoints = on
