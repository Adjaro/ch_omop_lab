ch_omop_lab:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CH_HOST', 'localhost') }}"
      port: "{{ env_var('CH_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CH_USER', 'dbt') }}"
      password: "{{ env_var('CH_PASSWORD', 'dbt_lab_pwd') }}"
      schema: lab
      secure: false
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 30
      send_receive_timeout: 7200
      compression: "{{ env_var('CH_COMPRESSION', 'lz4') }}"
      custom_settings:
        max_partitions_per_insert_block: 1000
